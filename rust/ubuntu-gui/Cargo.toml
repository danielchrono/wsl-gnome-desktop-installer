[package]
name = "ubuntu-gui"
version = "0.1.0"
edition = "2021"
description = "Instala o Ubuntu no WSL2 com desktop GNOME completo via RDP (port Rust do modulo PowerShell UbuntuGui)."
license = "MIT"

[[bin]]
name = "ubuntu-gui"
path = "src/main.rs"

[lib]
name = "ubuntu_gui"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rcgen = "0.13"
crossterm = "0.28"
time = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
mslnk = "0.1"

[dev-dependencies]
serde_json = "1"
